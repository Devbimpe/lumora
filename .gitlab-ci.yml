stages:
  - deploy

variables:
  # Adding this saves Vercel CLI telemetry
  VERCEL_TELEMETRY_DISABLED: 1

before_script:
  # Install Vercel CLI
  - npm install -g vercel
  # Install Firebase CLI
  - curl -sL https://firebase.tools | bash

deploy_staging:
  stage: deploy
  image: node:24
  script:
    # Pull the Vercel Preview environment configuration and secrets
    - vercel pull --yes --environment=preview
    # Build the project for the Preview environment
    - vercel build
    # Deploy Firebase assets to DEV
    - firebase --project lumora-16953 deploy --non-interactive
    # Deploy to Vercel (Staging/Preview)

    - DEPLOY_URL=$(vercel deploy --prebuilt 2>/dev/null | tail -1)
    - echo "Deployed to $DEPLOY_URL"
    # Pin it to a stable alias
    - vercel alias set $DEPLOY_URL lumora-staging.vercel.app

  only:
    - dev

deploy_production:
  stage: deploy
  image: node:24
  script:
    # Pull the Vercel Production environment configuration and secrets
    - vercel pull --yes --environment=production
    # Build the project for the Production environment
    - vercel build --prod
    # Deploy Firebase assets to PROD
    - firebase --project lumora-prod-91c61 deploy --non-interactive
    # Deploy to Vercel (Production)
    - DEPLOY_URL=$(vercel deploy --prebuilt --prod 2>/dev/null | tail -1)
    - echo "Deployed to $DEPLOY_URL"
    # Pin it to a stable alias
    - vercel alias set $DEPLOY_URL lumora-app.vercel.app
  only:
    - main
