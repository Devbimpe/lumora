stages:
  - deploy

variables:
  VERCEL_TELEMETRY_DISABLED: 1

before_script:
  # 1. Clear out any lingering university server environment variables
  - unset NPM_CONFIG_PREFIX
  
  # 2. Install NVM (Node Version Manager) on the fly
  - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
  - export NVM_DIR="$HOME/.nvm"
  - \. "$NVM_DIR/nvm.sh"
  
  # 3. Install and use Node.js
  - nvm install 24
  - nvm use 24
  
  # 4. Install Vercel and Firebase CLI cleanly into our fresh Node environment
  - npm config set cache "${CI_PROJECT_DIR}/.cache/npm" --global
  - npm install -g vercel firebase-tools

cache:
  paths:
  - .cache

deploy_staging:
  tags: [ugrad]
  stage: deploy
  script:
    # Pull the Vercel Preview environment configuration and secrets
    - npx vercel pull --yes --environment=preview
    # Build the project for the Preview environment
    - npx vercel build
    # Deploy Firebase assets to DEV
    - firebase --project lumora-16953 deploy --non-interactive
    # Deploy to Vercel (Staging/Preview)
    - DEPLOY_URL=$(npx vercel deploy --prebuilt | tail -1)
    - echo "Deployed to $DEPLOY_URL"
    # Pin it to a stable alias
    - npx vercel alias set $DEPLOY_URL lumora-staging.vercel.app
  only:
    - dev

deploy_production:
  tags: [ugrad]
  stage: deploy
  script:
    # Pull the Vercel Production environment configuration and secrets
    - npx vercel pull --yes --environment=production
    # Build the project for the Production environment
    - npx vercel build --prod
    # Deploy Firebase assets to PROD
    - firebase --project lumora-prod-91c61 deploy --non-interactive
    # Deploy to Vercel (Production)
    - DEPLOY_URL=$(npx vercel deploy --prebuilt --prod | tail -1)
    - echo "Deployed to $DEPLOY_URL"
    # Pin it to a stable alias
    - npx vercel alias set $DEPLOY_URL lumora-app.vercel.app
  only:
    - main