# Use a Node image that matches your local development environment
image: node:20

# Define variables globally (these will be pulled from your GitLab CI/CD settings)
variables:
  token: $token
  VERCEL_ORG_ID: $VERCEL_ORG_ID
  VERCEL_PROJECT_ID: $VERCEL_PROJECTID

stages:
  - deploy

# Deployment for all branches (Preview)
deploy_preview:
  stage: deploy
  rules:
  - if: '$CI_COMMIT_MESSAGE =~ /DEPLOY/'
  script:
    - npm install --global vercel
    - npx vercel --token=$token

# # Prints all CI/CD environment variables (keys and values)
# print_ci_cd_variables:
#   stage: deploy
#   script:
#     - echo "Printing all environment variables available in this job:"
#     - printenv | sort

# Deployment for the 'main' branch (Production)
deploy_production:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "Development"'
    - if: '$CI_COMMIT_MESSAGE =~ /PROD/'
  script:
    - npm install --global vercel
    - npx vercel --token=$token --prod
